name: trojan-rb
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - pandas
  - pyarrow
  - h5py
  - scikit-learn
  - requests
  - ipykernel
  - pytest
  - pip
  - pip:
      - rebound==4.6.0
      - reboundx==4.6.2
# After creating or updating the env, from the repo root:
#   conda run -n trojan-rb pip install --no-deps -e campaign
