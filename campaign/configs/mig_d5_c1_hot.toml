# D5: D1 at the C1 rate (nu_I 0.45): C1 tracks and disc zone, e0 <= 0.05, i0 0-40 deg.
# Question: does the L4 excess rise with i0 at half the D1 rate too?
[run]
run_id = "mig_d5_c1_hot"
t_classify_yr = 1.2e6

[jupiter]
track_csv = "tracks/c1_jupiter_nu045.csv"

[giants.saturn]
track_csv = "tracks/c1_saturn_nu045.csv"
[giants.uranus]
track_csv = "tracks/c0_uranus.csv"
[giants.neptune]
track_csv = "tracks/c0_neptune.csv"

[disc]
n_pairs = 15000
a_min_au = 10.95
a_max_au = 11.75
e_max = 0.05
inc_max_deg = 40.0
seed = 20261112

[snapshots]
fine_every_yr = 2000.0

[parallel]
n_chunks = 8
workers = 8
