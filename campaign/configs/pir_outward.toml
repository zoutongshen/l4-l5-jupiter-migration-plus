# Pirani+2019a reproduction (stage 9): outward, Jupiter 5.08 -> 18.26 au, Jupiter alone (her sect. 4.2, Fig. 12; planets not stated, G7)
# docs/PIRANI_2019A_REPRODUCTION.md. Repeats 0..9 re-randomise the disc (seed + repeat).
[run]
run_id = "pir_outward"
t_end_yr = 5.0e6          # her Table 3 is read at 5 Myr

[giants]                  # simulation order; tracks from s9_pirani_tracks.py
jupiter = "pirani19a/track_outward_jupiter.csv"

[disc]          # her sect. 3: 44 rings of 0.5 au x 1000 particles, 4-26 au; e <= 0.01, i <= 0.01 deg
a_min_au = 4.0
a_max_au = 26.0
ring_au = 0.5
n_per_ring = 1000
e_max = 0.01
inc_max_deg = 0.01
seed = 4000

[integrator]    # her MERCURY hybrid at 50 d
name = "mercurius"
dt_days = 50.0
check_every_steps = 32     # sample/force-update every 4.4 yr (libration ~150 yr; damping >= 100 yr)

[physics]
drag = true
drag_every_yr = 100.0
planet_density_g_cm3 = 1.33
sun_radius_au = 0.005

[snapshots]     # 10 kyr through the migration (her Figs. 7, 11), 50 kyr after
fine_every_yr = 1.0e4
fine_until_yr = 3.5e6
every_yr = 5.0e4

[parallel]
n_chunks = 24
workers = 24
