# C1 (cold zone): as C0b, but type I migration twice as fast (nu_I = 0.45 instead of
# 0.225; Pirani's x0.5-like rate). Jupiter 11.36 -> 5.4 au. Saturn forms with Jupiter
# and ends at 11.5 au so the J-S period ratio never reaches 2 (it crosses the 5:2 and
# 3:1 once each, diverging, while M_S < 35 M_E; ends at 3.11). Ice giants as C0.
# Disc: cold starts in Jupiter's starting zone. Question: does a faster rate raise
# the e0 < 0.05 excess towards Pirani's saturated 1.6-1.8?
[run]
run_id = "mig_c1_nu045_cold"
t_classify_yr = 1.2e6

[jupiter]
track_csv = "tracks/c1_jupiter_nu045.csv"

[giants.saturn]
track_csv = "tracks/c1_saturn_nu045.csv"
[giants.uranus]
track_csv = "tracks/c0_uranus.csv"
[giants.neptune]
track_csv = "tracks/c0_neptune.csv"

[disc]
n_pairs = 10000
a_min_au = 10.95
a_max_au = 11.75
e_max = 0.1
inc_max_deg = 15.0
seed = 20261107

[snapshots]
fine_every_yr = 2000.0

[parallel]
n_chunks = 8
workers = 8
